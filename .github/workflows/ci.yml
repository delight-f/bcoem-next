name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php:
    name: PHP ${{ matrix.php }} — phpstan, pint, phpunit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bcoem_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json/composer.lock
        run: composer validate --strict

      - name: Audit PHP dependencies for known vulnerabilities
        run: composer audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Run migrations against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bcoem_test
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_TABLE_PREFIX: baseline_
        run: |
          # The baseline_*-prefixed schema is loaded separately above, so the
          # Laravel framework migrations (0001_01_01_*) would collide with it
          # (e.g. baseline_users). Run only the port-added migrations, each by
          # explicit --path (the migrator records them, so repeats are no-ops).
          for path in database/migrations/2026_08_24_000000_create_payments_table.php \
                      database/migrations/2026_08_24_100000_add_prefsstripe_to_preferences_table.php \
                      database/migrations/2026_08_31_000000_add_contest_info_extra_to_contest_info_table.php; do
            php artisan migrate --force --path="$path"
          done

      - name: PHPStan (level 8, empty baseline policy)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bcoem_test
          DB_USERNAME: root
          DB_PASSWORD: root
          BCOEM_TEST_DB_HOST: 127.0.0.1
          BCOEM_TEST_DB_USER: root
          BCOEM_TEST_DB_PASS: root
          BCOEM_TEST_DB_NAME: bcoem_test
        run: vendor/bin/phpunit
