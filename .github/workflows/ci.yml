name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php:
    name: PHP ${{ matrix.php }} — phpstan, pint, phpunit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bcoem_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json/composer.lock
        run: composer validate --strict

      - name: Audit PHP dependencies for known vulnerabilities
        run: composer audit

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Load baseline schema into MySQL
        run: mysql -h 127.0.0.1 -uroot -proot bcoem_test < sql/bcoem_baseline_3.0.X.sql

      - name: Run migrations against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bcoem_test
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_TABLE_PREFIX: baseline_
        run: |
          # The baseline_*-prefixed schema is loaded separately above, so the
          # Laravel framework migrations (0001_01_01_*) would collide with it
          # (e.g. baseline_users). Run every other migration by explicit
          # --path (the migrator records them, so repeats are no-ops). Globbed
          # rather than listed so a new migration cannot be forgotten here.
          for path in $(ls database/migrations/*.php | grep -v '/0001_'); do
            php artisan migrate --force --path="$path"
          done

      # The output/PDF tests extract rendered PDF text with `pdftotext`
      # (poppler-utils) and assert on the copy. Without it shell_exec returns
      # null and the assertions compare against an empty string.
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: PHPStan (level 8, empty baseline policy)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint (code style)
        run: vendor/bin/pint --test

      # Info/style findings are pre-existing and intentional (e.g. the inline
      # PHP in install.sh is single-quoted on purpose), so gate on the levels
      # that catch real bugs.
      - name: Shellcheck (install and release scripts)
        run: shellcheck --severity=warning scripts/install.sh build/release.sh

      - name: PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bcoem_test
          DB_USERNAME: root
          DB_PASSWORD: root
          BCOEM_TEST_DB_HOST: 127.0.0.1
          BCOEM_TEST_DB_USER: root
          BCOEM_TEST_DB_PASS: root
          BCOEM_TEST_DB_NAME: bcoem_test
        run: vendor/bin/phpunit
