name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, phpstan, phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bcoem_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, gd, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Load baseline schema into MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -proot bcoem_test < sql/bcoem_baseline_3.0.X.sql

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP syntax check (all tracked files)
        run: |
          set -e
          while IFS= read -r file; do
            php -l "$file" > /dev/null
          done < <(git ls-files '*.php')

      - name: PHPStan (level 8, empty baseline policy)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPUnit (integration tests run against the loaded schema)
        env:
          BCOEM_TEST_DB_HOST: 127.0.0.1
          BCOEM_TEST_DB_USER: root
          BCOEM_TEST_DB_PASS: root
          BCOEM_TEST_DB_NAME: bcoem_test
        run: vendor/bin/phpunit
